[package]
name = "dtmoney"
version = "1.0.0"
description = "dtmoney - Personal Finance Manager"
authors = ["Duktek AI Assistant"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "macros"] }

tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

once_cell = "1.18"
parking_lot = "0.12"
dashmap = "5.0"
async-trait = "0.1"

# Date/time handling
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
chrono-tz = "0.8"

# CSV/Excel export
csv = "1.2"
calamine = "0.21"
xlsxwriter = "0.5"

# Image handling
image = { version = "0.24", features = ["jpeg", "png", "bmp", "gif"] }
base64 = "0.21"

# Compression
flate2 = "1.0"
zip = "0.6"

# Windows specific
#[cfg(target_os = "windows")]
winreg = "0.10"
#[cfg(target_os = "windows")]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-lto]
inherits = "release"
lto = "fat"