name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dtmoney/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            dtmoney/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: ./dtmoney
        run: npm ci

      - name: Build frontend
        working-directory: ./dtmoney
        run: npm run build

      - name: Build Tauri app (MSVC)
        working-directory: ./dtmoney/src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Find installer artifacts
        id: artifacts
        working-directory: ./dtmoney/src-tauri
        run: |
          $files = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/ -Recurse -Filter "*.exe", "*.msi" | Select-Object -ExpandProperty FullName
          $files | ForEach-Object { echo "FILE=$_"; }
          echo "FILES_JSON=$($files | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dtmoney-windows-installer
          path: |
            dtmoney/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            dtmoney/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dtmoney/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            dtmoney/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}